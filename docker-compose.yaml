version: "3.9"
services:
  back:
    build: .
    ports:
      - "8080:8080"
      - "5555:5555"
    environment:
      YDB_HOST: db
      YDB_PORT: 5432
      YDB_USER_NAME: ydb
      YDB_PASSWORD: pass
    depends_on:
      - db

  db:
    image: cr.yandex/crptqonuodf51kdj7a7d/ydb-enterpise:25.1.4.ent.5
#    image: prep_db:1
    ports:
      - "2136:2136"
    environment:
      YDB_PASSWORD: ydb
      YDB_USER: pass
    command: -p 2136