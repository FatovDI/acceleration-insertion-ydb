batch_insertion.batch_size=5
spring.datasource.driver-class-name=tech.ydb.jdbc.YdbDriver
spring.datasource.url=jdbc:ydb:grpc://${YDB_HOST:localhost}:${YDB_PORT:2136}/?database=${YDB_DATABASE:local}
spring.datasource.username=${YDB_USER_NAME:}
spring.datasource.password=${YDB_PASSWORD:}
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_size=${batch_insertion.batch_size}
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.contexts=all,dev
