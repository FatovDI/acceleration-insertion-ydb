# add environment variables to start via Idea -> YDB_HOST=localhost;YDB_PASSWORD=pass;YDB_PORT=2136;YDB_USER_NAME=ydb

batch_insertion:
  batch_size: 5000
  pool_size: 8
  concurrent_saves: 4

logging:
  level:
    org:
      hibernate: info

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        generate_statistics: true
        ddl-auto: validate
        jdbc:
          batch_size: ${batch_insertion.batch_size}
        order_inserts: true
        dialect: tech.ydb.hibernate.dialect.YdbDialect
#        format_sql: false
    open-in-view: false
#  sql:
#    init:
#      mode: never
  datasource:
    username: ${YDB_USER_NAME}
    password: ${YDB_PASSWORD}
    url: jdbc:ydb:grpc://${YDB_HOST}:${YDB_PORT}/?database=local
    schemas: "local"
    hikari:
      schema: "local"
      maximum-pool-size: 20
    driver-class-name: "tech.ydb.jdbc.YdbDriver"
  flyway:
    enabled: false
    baseline-on-migrate: true
    sql-migration-prefix: #empty prefix
    validate-migration-naming: true
#    schemas: "local"
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    contexts: all,dev

